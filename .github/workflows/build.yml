name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/peek

defaults:
  run:
    working-directory: peek

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: peek

      - uses: jdx/mise-action@v2
        with:
          working_directory: peek

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            peek/target
          key: cargo-${{ hashFiles('peek/Cargo.lock', 'peek/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run package

      - uses: actions/upload-artifact@v7
        with:
          name: alaydriem-peek-${{ github.sha }}-windows-x64
          path: peek/dist/@alaydriem/peek/
